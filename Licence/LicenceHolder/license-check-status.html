<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Task Status | Hameethiya Premium</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #08090a;
            --bg-accent: #111315;
            --gold: #d4af37;
            --gold-bright: #f1d592;
            --gold-muted: rgba(212, 175, 55, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-lux: 0 20px 40px rgba(0, 0, 0, 0.4);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            --radius: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 5% 5%, rgba(212, 175, 55, 0.04) 0%, transparent 35%),
                radial-gradient(circle at 95% 95%, rgba(212, 175, 55, 0.04) 0%, transparent 35%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Section */
        .header {
            background: var(--glass);
            backdrop-filter: blur(20px);
            padding: 2rem 3rem;
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-lux);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.25rem;
            background: linear-gradient(to right, var(--gold), var(--gold-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: 0.02em;
        }

        .back-btn {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: none;
        }

        .back-btn:hover {
            background: var(--gold-muted);
            border-color: var(--gold);
            color: var(--gold);
            transform: translateX(-5px);
        }

        /* Search Section */
        .search-container {
            background: var(--bg-accent);
            backdrop-filter: blur(20px);
            padding: 2.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--glass-border);
            display: flex;
            gap: 1.5rem;
            margin-bottom: 3rem;
            box-shadow: var(--shadow-lux);
            flex-wrap: wrap;
        }

        .search-input, .status-select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 1.1rem 1.5rem;
            border-radius: 16px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
            flex: 1;
            min-width: 250px;
        }

        .search-input:focus, .status-select:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        .status-select option {
            background: var(--bg-accent);
            color: var(--text-main);
        }

        /* Task Cards */
        #taskContainer {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        .task-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 1.75rem;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            border-left: 4px solid var(--gold);
            height: 100%;
        }

        .task-card:hover {
            transform: translateY(-5px);
            border-color: var(--gold-muted);
            box-shadow: var(--shadow-lux);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--glass-border);
        }

        .task-header h3 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.25rem;
            margin: 0;
        }

        /* Status Groups */
        .status-group {
            margin-bottom: 2.5rem;
        }

        .status-group-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--gold);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--gold-muted);
        }

        .status-group-title i {
            font-size: 1.1rem;
        }

        .status-count {
            font-size: 0.8rem;
            background: var(--gold-muted);
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            color: var(--gold-bright);
            font-family: 'Inter', sans-serif;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.25rem;
            align-items: stretch;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 0.4rem 0.8rem;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .delete-btn:hover {
            background: #ef4444;
            color: white;
            transform: scale(1.05);
        }

        .status-pending { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
        .status-processing { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
        .status-completed { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-appointment { background: rgba(139, 92, 246, 0.1); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, 0.2); }
        .status-test { background: rgba(236, 72, 153, 0.1); color: #ec4899; border: 1px solid rgba(236, 72, 153, 0.2); }

        .task-info {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 0.75rem;
            font-size: 0.95rem;
        }

        .task-info strong {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background: var(--bg-accent);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 900px;
            padding: 3.5rem;
            border-radius: 32px;
            box-shadow: var(--shadow-lux);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            width: 40px;            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--glass);
        }

        .close-btn:hover {
            color: var(--gold);
            background: var(--gold-muted);
            transform: rotate(90deg);
        }

        .print-btn {
            background: linear-gradient(135deg, var(--gold), var(--gold-bright));
            color: var(--bg-dark);
            border: none;
            padding: 1rem 2rem;
            border-radius: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            width: fit-content;
        }

        .print-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
            filter: brightness(1.1);
        }

        /* Report Modal Enhancements */
        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .report-section {
            background: rgba(255, 255, 255, 0.02);
            padding: 1.5rem;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .report-section h3 {
            color: var(--gold);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .report-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.9rem;
        }

        .report-label { color: var(--text-muted); }
        .report-value { color: var(--text-main); font-weight: 600; }

        .history-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .history-item {
            background: rgba(255, 255, 255, 0.01);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--gold-muted);
        }

        @media print {
            body { background: white !important; color: black !important; padding: 0 !important; }
            .container { max-width: 100% !important; margin: 0 !important; }
            .modal { position: relative !important; display: block !important; background: white !important; padding: 0 !important; }
            .modal-content { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; padding: 20px !important; color: black !important; }
            .report-section { border: 1px solid #ddd !important; background: transparent !important; }
            .report-label { color: #666 !important; }
            .report-value { color: black !important; }
            .history-item { border: 1px solid #eee !important; color: black !important; }
            .status-badge { border: 1px solid #ccc !important; color: black !important; background: white !important; }
            .header, .search-container, .close-btn, .print-btn, .back-btn, .status-group-title { display: none !important; }
        }

        @media (max-width: 768px) {
            body { padding: 1rem; }
            .header { padding: 1.5rem; flex-direction: column; gap: 1.5rem; text-align: center; }
            .search-container { padding: 1.5rem; }
            #taskContainer { grid-template-columns: 1fr; }
            .modal-content { padding: 2rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Check Task Status</h1>
            <button class="back-btn" onclick="location.href='../LicenceHolder/license-holder-Services.html'">
                <i class="fas fa-arrow-left"></i> Back
            </button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by name, license # or mobile..." onkeyup="filterTasks()">
            <select id="statusFilter" class="search-input" onchange="filterTasks()" style="margin-top: 1rem;">
                <option value="all">All Statuses</option>
            </select>
            <button onclick="window.print()" class="print-btn" style="margin-top: 1rem; width: 100%; justify-content: center;">
                <i class="fas fa-file-invoice"></i> Print Full Summary Report
            </button>
        </div>

        <div id="taskContainer">
            <!-- Tasks will be loaded here -->
        </div>
    </div>

    <!-- Add API utils script -->
    <script src="../api-utils.js"></script>

    <script>
        let currentTextFilter = '';
        let currentStatusFilter = 'all';

        async function populateStatusFilter() {
            const statusFilter = document.getElementById('statusFilter');
            const defaultStatuses = ['pending', 'processing', 'appointment fixed', 'test application generated', 'completed'];
            const customStatuses = await apiUtils.getSettings('licenseHolderStatuses', []);
            const customNames = customStatuses.map(s => s.name.toLowerCase());
            
            const allStatuses = [...new Set([...defaultStatuses, ...customNames])];
            
            statusFilter.innerHTML = '<option value="all">All Statuses</option>';
            allStatuses.forEach(s => {
                const option = document.createElement('option');
                option.value = s;
                option.textContent = s.charAt(0).toUpperCase() + s.slice(1);
                statusFilter.appendChild(option);
            });
        }

        async function updateTasks(textFilter = '', statusFilter = 'all') {
            const services = await apiUtils.getLicenseHolderServices();
            const container = document.getElementById('taskContainer');
            
            if (services.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem; color: #f0f0f0;">No tasks found</div>';
                return;
            }

            const filteredServices = services.filter(service => {
                const matchesText = (service.licenseNumber?.toLowerCase() || '').includes(textFilter.toLowerCase()) ||
                                  (service.name?.toLowerCase() || '').includes(textFilter.toLowerCase()) ||
                                  (service.mobileNumber || '').includes(textFilter);
                const matchesStatus = statusFilter === 'all' || service.status?.toLowerCase() === statusFilter.toLowerCase();
                return matchesText && matchesStatus;
            });

            // Grouping Logic
            const groups = {
                'pending': { title: 'Pending Applications', icon: 'fa-clock', tasks: [] },
                'processing': { title: 'Processing', icon: 'fa-spinner fa-spin', tasks: [] },
                'appointment fixed': { title: 'Appointments Fixed', icon: 'fa-calendar-check', tasks: [] },
                'test application generated': { title: 'Test Applications', icon: 'fa-file-alt', tasks: [] },
                'completed': { title: 'Completed Services', icon: 'fa-check-circle', tasks: [] },
                'others': { title: 'Other Statuses', icon: 'fa-info-circle', tasks: [] }
            };

            filteredServices.forEach(s => {
                const status = (s.status || 'pending').toLowerCase();
                if (groups[status]) {
                    groups[status].tasks.push(s);
                } else {
                    groups['others'].tasks.push(s);
                }
            });

            let html = '';
            for (const key in groups) {
                const group = groups[key];
                if (group.tasks.length > 0) {
                    const statusClass = key.includes('appointment') ? 'appointment' : 
                                      key.includes('test') ? 'test' : key;
                    
                    html += `
                        <div class="status-group">
                            <h2 class="status-group-title">
                                <i class="fas ${group.icon}"></i>
                                ${group.title}
                                <span class="status-count">${group.tasks.length}</span>
                            </h2>
                            <div class="task-grid">
                                ${group.tasks.map(service => `
                                    <div class="task-card" onclick="showDetails('${service.licenseNumber}')">
                                        <div class="task-header">
                                            <h3>${(service.name || 'No Name').toUpperCase()}</h3>
                                            <div style="display: flex; gap: 0.75rem; align-items: center;">
                                                <span class="status-badge status-${statusClass}">
                                                    ${(service.status || 'Pending').toUpperCase()}
                                                </span>
                                                <button class="delete-btn" onclick="event.stopPropagation(); deleteTask('${service.id || service.licenseNumber}')">
                                                    <i class="fas fa-trash-alt"></i>
                                                </button>
                                            </div>
                                        </div>
                                        <div class="task-info">
                                            <strong>License Number</strong> <span>${(service.licenseNumber || 'N/A').toUpperCase()}</span>
                                        </div>
                                        <div class="task-info">
                                            <strong>Reference</strong> <span>${(service.reference || 'N/A').toUpperCase()}</span>
                                        </div>
                                        <div class="task-info">
                                            <strong>Service Type</strong> <span>${(service.serviceType || 'N/A').toUpperCase()}</span>
                                        </div>
                                        <div class="task-info">
                                            <strong>Mobile</strong> <span>${service.mobileNumber || 'N/A'}</span>
                                        </div>
                                        <div class="task-info">
                                            <strong>Creation Date</strong> <span>${service.creationDate || 'N/A'}</span>
                                        </div>
                                        <div class="task-info">
                                            <strong>Notes</strong> <span>${(service.notes || 'No notes').toUpperCase()}</span>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            container.innerHTML = html || '<div style="grid-column: 1/-1; text-align: center; padding: 4rem; color: var(--text-muted);">No matching services found.</div>';
        }

        async function filterTasks() {
            const searchText = document.getElementById('searchInput').value;
            const status = document.getElementById('statusFilter').value;
            await updateTasks(searchText, status);
        }

        async function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task? This action cannot be undone.')) {
                try {
                    await apiUtils.deleteLicenseHolderService(id);
                    await filterTasks(); // Refresh list
                } catch (error) {
                    console.error('Error deleting task:', error);
                    alert('Failed to delete task. Please try again.');
                }
            }
        }

        // Initialize tasks
        document.addEventListener('DOMContentLoaded', async () => {
            await populateStatusFilter();
            await updateTasks();
        });
                 
        
        async function showDetails(licenseNumber) {
            const services = await apiUtils.getLicenseHolderServices();
            const service = services.find(s => s.licenseNumber === licenseNumber);
            
            if (!service) return;

            document.getElementById('modalTitle').textContent = `SERVICE REPORT - ${service.name.toUpperCase()}`;
            
            const balance = (service.commitmentPayment || 0) - (service.advancePayment || 0);
            const statusClass = (service.status || 'pending').toLowerCase().includes('appointment') ? 'appointment' : 
                              (service.status || 'pending').toLowerCase().includes('test') ? 'test' : 
                              (service.status || 'pending').toLowerCase();

            document.getElementById('modalContent').innerHTML = `
                <div class="report-grid">
                    <div class="report-section">
                        <h3><i class="fas fa-user-circle"></i> Applicant Details</h3>
                        <div class="report-item"><span class="report-label">License Number</span> <span class="report-value">${service.licenseNumber}</span></div>
                        <div class="report-item"><span class="report-label">Reference</span> <span class="report-value">${service.reference || 'N/A'}</span></div>
                        <div class="report-item"><span class="report-label">Mobile Number</span> <span class="report-value">${service.mobileNumber}</span></div>
                        <div class="report-item"><span class="report-label">Date of Birth</span> <span class="report-value">${service.dateOfBirth || 'N/A'}</span></div>
                    </div>

                    <div class="report-section">
                        <h3><i class="fas fa-info-circle"></i> Service Status</h3>
                        <div class="report-item"><span class="report-label">Current Status</span> <span class="status-badge status-${statusClass}">${(service.status || 'PENDING').toUpperCase()}</span></div>
                        <div class="report-item"><span class="report-label">Service Type</span> <span class="report-value">${service.serviceType}</span></div>
                        <div class="report-item"><span class="report-label">Creation Date</span> <span class="report-value">${service.creationDate || 'N/A'}</span></div>
                        ${service.appointmentDate ? `<div class="report-item"><span class="report-label">Appointment</span> <span class="report-value" style="color: var(--gold-bright);">📅 ${service.appointmentDate}</span></div>` : ''}
                    </div>
                </div>

                <div class="report-section" style="margin-bottom: 2rem;">
                    <h3><i class="fas fa-credit-card"></i> Payment Summary</h3>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; text-align: center;">
                        <div style="background: rgba(255,255,255,0.03); padding: 1rem; border-radius: 12px;">
                            <div class="report-label" style="font-size: 0.75rem; margin-bottom: 0.25rem;">Commitment</div>
                            <div class="report-value" style="font-size: 1.25rem;">₹${service.commitmentPayment || 0}</div>
                        </div>
                        <div style="background: rgba(16, 185, 129, 0.05); padding: 1rem; border-radius: 12px; border: 1px solid rgba(16, 185, 129, 0.1);">
                            <div class="report-label" style="font-size: 0.75rem; margin-bottom: 0.25rem; color: #10b981;">Paid</div>
                            <div class="report-value" style="font-size: 1.25rem; color: #10b981;">₹${service.advancePayment || 0}</div>
                        </div>
                        <div style="background: rgba(239, 68, 68, 0.05); padding: 1rem; border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.1);">
                            <div class="report-label" style="font-size: 0.75rem; margin-bottom: 0.25rem; color: #ef4444;">Balance</div>
                            <div class="report-value" style="font-size: 1.25rem; color: #ef4444;">₹${balance}</div>
                        </div>
                    </div>
                </div>

                <div class="report-grid">
                    <div class="report-section">
                        <h3><i class="fas fa-history"></i> Status History</h3>
                        ${(service.statusHistory || []).reverse().map(h => `
                            <div class="history-item">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                                    <span style="color: var(--gold); font-weight: 600; font-size: 0.8rem;">${h.date ? new Date(h.date).toLocaleDateString() : 'N/A'}</span>
                                    <span style="font-size: 0.7rem; color: var(--text-muted);">${h.to || h.status}</span>
                                </div>
                                <div style="font-size: 0.85rem;">${h.notes || 'Status Updated'}</div>
                            </div>
                        `).join('') || '<div class="report-label">No history available</div>'}
                    </div>

                    <div class="report-section">
                        <h3><i class="fas fa-comments"></i> Intimation Log</h3>
                        ${(service.intimations || []).reverse().map(i => `
                            <div class="history-item" style="border-left-color: var(--text-muted);">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.25rem;">
                                    <span style="color: var(--gold); font-weight: 600; font-size: 0.8rem;">${i.date}</span>
                                    <span style="font-size: 0.7rem; color: var(--text-muted);">${i.status}</span>
                                </div>
                                <div style="font-size: 0.85rem;">${i.remarks || 'No remarks'}</div>
                            </div>
                        `).join('') || '<div class="report-label">No intimations recorded</div>'}
                    </div>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button onclick="window.print()" class="print-btn"><i class="fas fa-print"></i> Print Report</button>
                    <button onclick="closeModal()" class="print-btn" style="background: var(--glass); color: var(--text-main); border: 1px solid var(--glass-border);"><i class="fas fa-times"></i> Close</button>
                </div>
            `;

            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('detailsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
    
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle"></h2>
            <div id="modalContent"></div>
        </div>
    </div>
</body>
</html>
