<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Payment Management | Hameethiya Premium</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #08090a;
            --bg-accent: #111315;
            --gold: #d4af37;
            --gold-bright: #f1d592;
            --gold-muted: rgba(212, 175, 55, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --shadow-lux: 0 20px 40px rgba(0, 0, 0, 0.4);
            --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(212, 175, 55, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(212, 175, 55, 0.03) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Section */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .header-title h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.25rem;
            background: linear-gradient(to right, var(--gold), var(--gold-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .total-balance {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: var(--gold-muted);
            padding: 0.75rem 1.5rem;
            border-radius: 20px;
            border: 1px solid var(--gold);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.1);
        }

        .total-balance .label {
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        .total-balance .amount {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            transition: var(--transition);
        }

        .total-balance .amount.balance-animate {
            transform: scale(1.1);
            color: var(--gold-bright);
        }

        .back-button {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .back-button:hover {
            background: var(--gold-muted);
            border-color: var(--gold);
            color: var(--gold);
            transform: translateX(-5px);
        }

        /* Filter Section */
        .controls-panel {
            background: var(--bg-accent);
            backdrop-filter: blur(20px);
            padding: 2rem;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            margin-bottom: 3rem;
            box-shadow: var(--shadow-lux);
        }

        .search-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.5rem;
            border-radius: 14px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        .search-bar:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        /* Table Styles */
        .table-container {
            background: var(--glass);
            border-radius: 28px;
            border: 1px solid var(--glass-border);
            overflow: hidden;
            box-shadow: var(--shadow-lux);
        }

        .applicants-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .applicants-table th {
            background: rgba(255, 255, 255, 0.03);
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            font-size: 0.95rem;
            font-weight: 600;
            padding: 1.5rem 1.25rem;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
            letter-spacing: 0.02em;
        }

        .applicants-table td {
            padding: 1.25rem;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
            transition: var(--transition);
        }

        .applicants-table tr:last-child td {
            border-bottom: none;
        }

        .applicants-table tr:hover td {
            background: rgba(212, 175, 55, 0.03);
            cursor: pointer;
        }

        .amount-cell {
            font-weight: 600;
            font-family: 'Inter', sans-serif;
        }

        .balance-high { color: #ef4444; }
        .balance-zero { color: #10b981; }

        /* Modal Styles */
        .payment-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background: var(--bg-accent);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 600px;
            padding: 3rem;
            border-radius: 32px;
            box-shadow: var(--shadow-lux);
            position: relative;
        }

        .modal-content h2 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            margin-bottom: 2rem;
            font-size: 1.75rem;
        }

        .balance-info {
            background: rgba(255, 255, 255, 0.02);
            padding: 1.5rem;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            margin-bottom: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .balance-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .balance-info strong {
            display: block;
            color: var(--text-main);
            font-size: 1rem;
            margin-top: 0.25rem;
        }

        .payment-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .payment-form input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 1rem 1.25rem;
            border-radius: 12px;
            color: var(--text-main);
            font-family: inherit;
            transition: var(--transition);
        }

        .payment-form input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--gold), var(--gold-bright));
            color: var(--bg-dark);
            border: none;
            padding: 1rem;
            border-radius: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.2);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--glass-border);
            padding: 1rem;
            border-radius: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .header { flex-direction: column; align-items: flex-start; }
            .applicants-table { display: block; overflow-x: auto; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <button class="back-button" onclick="window.location.href='fresh-license.html'">
                    <i class="fas fa-chevron-left"></i> Back
                </button>
                <h1>License Payment</h1>
            </div>
            <div class="total-balance">
                <span class="label">Total Outstanding</span>
                <span class="amount" id="totalBalanceAmount">₹0</span>
            </div>
        </div>

        <div class="controls-panel">
            <input type="text" class="search-bar" placeholder="Search applicant name, mobile, or ID..." 
                oninput="filterApplicants()" onkeyup="filterApplicants()">
        </div>

        <div class="table-container">
            <table class="applicants-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Applicant Name</th>
                        <th>Vehicle Class</th>
                        <th>Declared</th>
                        <th>Paid</th>
                        <th>Last Payment</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody id="applicantsList"></tbody>
            </table>
        </div>
    </div>

    <div class="payment-modal" id="paymentModal">
        <div class="modal-content">
            <h2>Add Payment</h2>
            <div class="balance-info" id="balanceInfo"></div>
            <form class="payment-form" onsubmit="handlePayment(event)">
                <input type="hidden" id="currentApplicantId">
                <input type="number" id="paymentAmount" placeholder="Enter payment amount" required>
                <input type="text" id="paymentNote" placeholder="Payment note (optional)">
                <button type="submit" class="btn-submit">Submit Payment</button>
                <button type="button" class="btn-cancel" onclick="closePaymentModal()">Cancel</button>
            </form>
        </div>
    </div>

    <!-- API Utils -->
    <script src="api-utils.js"></script>

    <script>
        async function loadApplicants() {
            const tasks = await apiUtils.getTasks();
            const applicantsList = document.getElementById('applicantsList');
            
            applicantsList.innerHTML = tasks.map(task => {
                const advanceAmount = Number(task.advancePayment) || 0;
                const paidAmount = (task.payments?.reduce((sum, payment) => sum + Number(payment.amount), 0) || 0) + advanceAmount;
                const balance = Number(task.declaredPayment) - paidAmount;
                const lastPaymentDate = getLastPaymentDate(task);
                
                return `
                    <tr onclick="showPaymentModal('${task.id}')">
                        <td style="color: var(--text-muted);">#${String(task.id).padStart(4, '0')}</td>
                        <td style="font-weight: 600; color: var(--gold-bright);">${task.applicantName.toUpperCase()}</td>
                        <td>${task.vehicleClass.toUpperCase()}</td>
                        <td class="amount-cell">₹${task.declaredPayment}</td>
                        <td class="amount-cell">₹${paidAmount}</td>
                        <td style="font-size: 0.8rem;">${lastPaymentDate}</td>
                        <td class="amount-cell ${balance > 0 ? 'balance-high' : 'balance-zero'}">₹${balance}</td>
                    </tr>
                `;
            }).join('');
            updateTotalBalance(tasks);
        }

        function getLastPaymentDate(task) {
            if (!task.payments || task.payments.length === 0) {
                return task.advancePayment ? task.creationDate : '-';
            }
            const lastPayment = task.payments[task.payments.length - 1];
            return new Date(lastPayment.date).toLocaleDateString();
        }

        async function filterApplicants() {
            const searchTerm = document.querySelector('.search-bar').value.toLowerCase();
            const tasks = await apiUtils.getTasks();
            const applicantsList = document.getElementById('applicantsList');
            
            const filteredTasks = tasks.filter(task => 
                task.status !== 'completed' && 
                (
                    (task.applicantName && task.applicantName.toLowerCase().includes(searchTerm)) ||
                    (task.mobile && task.mobile.toLowerCase().includes(searchTerm)) ||
                    String(task.id).toLowerCase().includes(searchTerm)
                )
            );

            if (filteredTasks.length === 0) {
                applicantsList.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 3rem; color: var(--text-muted);">No matching records found</td></tr>';
                updateTotalBalance([]);
                return;
            }

            applicantsList.innerHTML = filteredTasks.map(task => {
                const advanceAmount = Number(task.advancePayment) || 0;
                const paidAmount = (task.payments?.reduce((sum, payment) => sum + Number(payment.amount), 0) || 0) + advanceAmount;
                const balance = Number(task.declaredPayment) - paidAmount;
                const lastPaymentDate = getLastPaymentDate(task);
                
                return `
                    <tr onclick="showPaymentModal('${task.id}')">
                        <td style="color: var(--text-muted);">#${String(task.id).padStart(4, '0')}</td>
                        <td style="font-weight: 600; color: var(--gold-bright);">${task.applicantName.toUpperCase()}</td>
                        <td>${task.vehicleClass.toUpperCase()}</td>
                        <td class="amount-cell">₹${task.declaredPayment}</td>
                        <td class="amount-cell">₹${paidAmount}</td>
                        <td style="font-size: 0.8rem;">${lastPaymentDate}</td>
                        <td class="amount-cell ${balance > 0 ? 'balance-high' : 'balance-zero'}">₹${balance}</td>
                    </tr>
                `;
            }).join('');
            updateTotalBalance(filteredTasks);
        }

        async function showPaymentModal(applicantId) {
            const tasks = await apiUtils.getTasks();
            const task = tasks.find(t => String(t.id) === String(applicantId));
            
            if (task) {
                const advanceAmount = Number(task.advancePayment) || 0;
                const paidAmount = (task.payments?.reduce((sum, payment) => sum + Number(payment.amount), 0) || 0) + advanceAmount;
                const balance = Number(task.declaredPayment) - paidAmount;
                
                document.getElementById('currentApplicantId').value = applicantId;
                document.getElementById('balanceInfo').innerHTML = `
                    <div><p>Applicant</p><strong>${task.applicantName.toUpperCase()}</strong></div>
                    <div><p>Declared Amount</p><strong>₹${task.declaredPayment}</strong></div>
                    <div><p>Total Paid</p><strong>₹${paidAmount}</strong></div>
                    <div><p>Outstanding</p><strong style="color: #ef4444;">₹${balance}</strong></div>
                `;
                
                document.getElementById('paymentModal').style.display = 'flex';
            }
        }

        function closePaymentModal() {
            document.getElementById('paymentModal').style.display = 'none';
            document.querySelector('.payment-form').reset();
        }

        async function handlePayment(event) {
            event.preventDefault();
            const applicantId = document.getElementById('currentApplicantId').value;
            const amount = Number(document.getElementById('paymentAmount').value);
            const note = document.getElementById('paymentNote').value;
            
            const tasks = await apiUtils.getTasks();
            const taskIndex = tasks.findIndex(t => String(t.id) === String(applicantId));
            
            if (taskIndex > -1) {
                if (!tasks[taskIndex].payments) tasks[taskIndex].payments = [];
                tasks[taskIndex].payments.push({
                    amount,
                    note,
                    date: new Date().toISOString(),
                    receivedBy: JSON.parse(localStorage.getItem('currentUser'))?.username || 'System'
                });
                
                await apiUtils.saveTask(tasks[taskIndex]);
                closePaymentModal();
                await loadApplicants();
            }
        }

        function updateTotalBalance(taskList) {
            const amountEl = document.getElementById('totalBalanceAmount');
            if (!amountEl) return;
            const total = (taskList || []).reduce((sum, task) => {
                const advanceAmount = Number(task.advancePayment) || 0;
                const paidAmount = (task.payments?.reduce((s, p) => s + Number(p.amount), 0) || 0) + advanceAmount;
                const declared = Number(task.declaredPayment) || 0;
                const balance = Math.max(0, declared - paidAmount);
                return sum + balance;
            }, 0);
            
            const formatted = `₹${total}`;
            if (amountEl.textContent !== formatted) {
                amountEl.textContent = formatted;
                amountEl.classList.add('balance-animate');
                setTimeout(() => amountEl.classList.remove('balance-animate'), 220);
            }
        }

        window.onclick = (e) => { if (e.target.id === 'paymentModal') closePaymentModal(); };
        window.onload = loadApplicants;
    </script>
</body>
</html>
