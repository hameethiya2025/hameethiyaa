<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Hameethiya Driving School</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
        }
        .login-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--glass-border);
        }
        .toggle-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: var(--transition);
            font-size: 0.9rem;
        }
        .toggle-btn.active {
            background: var(--gold-gradient);
            color: var(--secondary-color);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .login-form {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        .login-form.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            color: white;
            transition: var(--transition);
        }
        .form-group input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.08);
            outline: none;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            margin-top: 30px;
            transition: var(--transition);
        }
        .back-link:hover {
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="login-container glass-card">
        <div class="logo-icon" style="margin: 0 auto 20px;">H</div>
        <h2 style="margin-bottom: 30px; color: var(--primary-color);">Welcome Back</h2>
        
        <div class="login-toggle">
            <button class="toggle-btn active" onclick="switchLogin('student')">Student Login</button>
            <button class="toggle-btn" onclick="switchLogin('admin')">Admin Login</button>
        </div>

        <!-- Student Login Form -->
        <div id="studentForm" class="login-form active">
            <form onsubmit="handleStudentLogin(event)">
                <div class="form-group">
                    <label>Student User ID</label>
                    <input type="text" id="student_id" required placeholder="Enter your User ID">
                </div>
                <div class="form-group">
                    <label>Mobile Number</label>
                    <input type="tel" id="student_mobile" required placeholder="Enter registered mobile">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Login to Portal</button>
            </form>
            <p style="margin-top: 20px; font-size: 0.75rem; color: var(--text-muted);">
                Student ID is provided after registration.
            </p>
        </div>

        <!-- Admin Login Form -->
        <div id="adminForm" class="login-form">
            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label>Admin Username</label>
                    <input type="text" id="admin_user" required placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="admin_pass" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Admin Access</button>
            </form>
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAY8aW7751YUvDdv4xZYnXSF5AZevOBIxI",
            authDomain: "hameethiya.firebaseapp.com",
            projectId: "hameethiya",
            storageBucket: "hameethiya.firebasestorage.app",
            messagingSenderId: "206037846",
            appId: "1:206037846:web:0bcbcfd67f6989e46d6cf7",
            measurementId: "G-8ZQ1Y0CPQZ"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function switchLogin(type) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.login-form').forEach(form => form.classList.remove('active'));
            
            if (type === 'student') {
                document.querySelector('.toggle-btn:nth-child(1)').classList.add('active');
                document.getElementById('studentForm').classList.add('active');
            } else {
                document.querySelector('.toggle-btn:nth-child(2)').classList.add('active');
                document.getElementById('adminForm').classList.add('active');
            }
        }

        async function handleStudentLogin(e) {
            e.preventDefault();
            const studentId = document.getElementById('student_id').value.toUpperCase();
            const mobile = document.getElementById('student_mobile').value;

            try {
                const snapshot = await db.collection("registrations")
                    .where("mobile", "==", mobile)
                    .get();

                if (snapshot.empty) {
                    alert("Invalid Mobile Number. Please check with the office.");
                    return;
                }
                
                const regDoc = snapshot.docs[0].data();
                
                if (regDoc.studentId === studentId) {
                    if (regDoc.loginExpired === true) {
                        alert("Your login has Expired");
                        return;
                    }
                    sessionStorage.setItem('hameethiya_student_logged_in', 'true');
                    sessionStorage.setItem('hameethiya_student_data', JSON.stringify(regDoc));
                    window.location.href = 'student.html';
                } else if (regDoc.loginExpired === true) {
                    alert("Your login has Expired");
                } else {
                    alert("Invalid User ID. Please check with the office.");
                }
            } catch (err) {
                alert("Login error: " + err.message);
            }
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('admin_user').value;
            const pass = document.getElementById('admin_pass').value;

            if (user === "admin" && pass === "hameethiya123") {
                sessionStorage.setItem('hameethiya_admin_logged_in', 'true');
                window.location.href = 'admin.html';
            } else {
                alert("Invalid credentials. Please try again.");
            }
        }

        // Check for active sessions
        window.onload = () => {
            if (sessionStorage.getItem('hameethiya_admin_logged_in') === 'true') {
                window.location.href = 'admin.html';
            } else if (sessionStorage.getItem('hameethiya_student_logged_in') === 'true') {
                window.location.href = 'student.html';
            }
        }
    </script>
</body>
</html>
